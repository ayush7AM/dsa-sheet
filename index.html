<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>500 — DSA Pattern Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11151a;
    --bg-elev:#181d23;
    --bg-elev-2:#1f252c;
    --bg-elev-3:#252c34;
    --border:#2a323b;
    --border-soft:#20272e;
    --text:#e7ebee;
    --text-dim:#8d97a1;
    --text-faint:#5a636d;
    --amber:#e3a53d;
    --amber-dim:#8a6a2f;
    --green:#5fb489;
    --green-dim:rgba(95,180,137,0.14);
    --violet:#a78bf0;
    --violet-dim:rgba(167,139,240,0.14);
    --easy:#5fb489;
    --medium:#e3a53d;
    --hard:#e2685a;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--amber-dim);color:#fff;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:rgba(17,21,26,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:18px 24px 16px;
  }
  .top-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; letter-spacing:0.14em; color:var(--amber); font-weight:600;
  }
  .brand h1{
    margin:0; font-size:22px; font-weight:700; letter-spacing:-0.01em; color:var(--text);
  }
  .brand p{margin:2px 0 0; font-size:13px; color:var(--text-dim);}

  .stat-strip{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  .stat{display:flex; flex-direction:column; align-items:flex-end; min-width:64px;}
  .stat .v{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--text); line-height:1;}
  .stat .l{font-size:11px; color:var(--text-faint); margin-top:4px; letter-spacing:0.02em;}
  .stat.done .v{color:var(--green);}
  .stat.revise .v{color:var(--violet);}

  .ring-wrap{position:relative; width:56px; height:56px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--bg-elev-3); stroke-width:5;}
  .ring-fill{fill:none; stroke:var(--amber); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
  .ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--text);
  }

  /* ---------- Layout ---------- */
  .shell{max-width:1180px; margin:0 auto; display:grid; grid-template-columns:230px 1fr; gap:0; align-items:start;}
  aside.rail{
    position:sticky; top:97px;
    padding:20px 14px 40px 24px;
    max-height:calc(100vh - 97px);
    overflow-y:auto;
  }
  aside.rail::-webkit-scrollbar{width:6px;}
  aside.rail::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
  .rail-title{font-size:11px; letter-spacing:0.1em; color:var(--text-faint); margin:0 0 10px 2px; font-family:'IBM Plex Mono',monospace;}
  .rail-item{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:8px 10px; border-radius:var(--radius); color:var(--text-dim);
    font-size:13px; font-family:'IBM Plex Sans',sans-serif;
    display:flex; flex-direction:column; gap:5px; margin-bottom:2px;
  }
  .rail-item:hover{background:var(--bg-elev);}
  .rail-item.active{background:var(--bg-elev-2); color:var(--text);}
  .rail-item .rline{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .rail-item .rname{font-weight:500;}
  .rail-item .rcount{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint);}
  .rail-bar{height:3px; background:var(--bg-elev-3); border-radius:2px; overflow:hidden;}
  .rail-bar i{display:block; height:100%; background:var(--amber);}

  main.content{padding:22px 24px 80px 20px; min-width:0;}

  /* ---------- Controls ---------- */
  .controls{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border-soft);
  }
  .search-box{
    flex:1 1 220px; position:relative;
  }
  .search-box input{
    width:100%; background:var(--bg-elev); border:1px solid var(--border); color:var(--text);
    padding:9px 12px 9px 32px; border-radius:var(--radius); font-size:13px; font-family:'IBM Plex Sans',sans-serif;
  }
  .search-box input:focus{outline:none; border-color:var(--amber-dim);}
  .search-box::before{
    content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:15px;
  }
  .chip-group{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim);
    padding:8px 13px; border-radius:999px; font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace;
    font-weight:500; transition:all .15s ease; white-space:nowrap;
  }
  .chip:hover{border-color:var(--text-faint); color:var(--text);}
  .chip.active{background:var(--bg-elev-3); border-color:var(--amber-dim); color:var(--amber);}
  .chip.active.v-active{border-color:var(--violet); color:var(--violet);}
  .chip.active.g-active{border-color:var(--green); color:var(--green);}

  /* ---------- Section / Subsection ---------- */
  .section-block{margin-bottom:38px; scroll-margin-top:110px;}
  .section-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:4px;
  }
  .section-head .sidx{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-size:13px; font-weight:600;}
  .section-head h2{font-size:18px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  .section-head .scount{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-faint);}
  .section-rule{height:1px; background:var(--border-soft); margin:10px 0 18px;}

  .sub-block{margin-bottom:22px; scroll-margin-top:110px;}
  .sub-head{margin-bottom:8px;}
  .sub-head h3{font-size:13.5px; margin:0 0 3px; color:var(--text); font-weight:600;}
  .sub-head .pattern{font-size:12px; color:var(--text-dim); line-height:1.45; max-width:820px;}
  .sub-head .pattern b{color:var(--text-dim); font-weight:600;}

  .qrow{
    display:flex; align-items:center; gap:12px;
    padding:9px 10px; border-radius:var(--radius);
    border:1px solid transparent;
    transition:background .12s ease, border-color .12s ease;
  }
  .qrow:hover{background:var(--bg-elev); border-color:var(--border-soft);}
  .qrow.done{background:var(--green-dim);}
  .qrow.done:hover{background:var(--green-dim);}
  .qrow.hidden{display:none;}

  .chk{
    width:19px; height:19px; border-radius:5px; border:1.5px solid var(--border);
    background:var(--bg-elev-2); cursor:pointer; flex-shrink:0; position:relative;
    display:flex; align-items:center; justify-content:center; transition:all .12s ease;
  }
  .chk:hover{border-color:var(--green);}
  .chk.checked{background:var(--green); border-color:var(--green);}
  .chk.checked::after{
    content:""; width:5px; height:9px; border:solid #0d130f; border-width:0 2px 2px 0;
    transform:rotate(45deg) translate(-1px,-1px);
  }

  .qid{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); width:32px; flex-shrink:0; text-align:right;}
  .qtitle{font-size:13.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qrow.done .qtitle{color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-faint);}

  .diff-tag{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:0.03em;
    padding:2px 7px; border-radius:4px; flex-shrink:0; text-transform:uppercase;
  }
  .diff-tag.Easy{color:var(--easy); background:rgba(95,180,137,0.12);}
  .diff-tag.Medium{color:var(--medium); background:rgba(227,165,61,0.12);}
  .diff-tag.Hard{color:var(--hard); background:rgba(226,104,90,0.12);}

  .date-input{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-dim);
    background:var(--bg-elev-2); border:1px solid var(--border); border-radius:4px;
    padding:4px 6px; width:122px; flex-shrink:0; color-scheme:dark;
  }
  .date-input:focus{outline:none; border-color:var(--amber-dim);}
  .date-input:disabled{opacity:0.35; cursor:not-allowed;}

  .rev-btn{
    width:26px; height:26px; border-radius:5px; border:1px solid var(--border); background:var(--bg-elev-2);
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:13px; transition:all .12s ease;
  }
  .rev-btn:hover{border-color:var(--violet);}
  .rev-btn.on{background:var(--violet-dim); border-color:var(--violet); color:var(--violet);}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint);
  }
  .empty-state .big{font-size:30px; margin-bottom:8px;}

  footer.foot{
    max-width:1180px; margin:0 auto; padding:20px 24px 50px; color:var(--text-faint); font-size:11.5px;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  footer.foot button{
    background:none; border:1px solid var(--border); color:var(--text-faint); font-family:'IBM Plex Mono',monospace;
    font-size:11px; padding:6px 11px; border-radius:4px; cursor:pointer;
  }
  footer.foot button:hover{border-color:var(--hard); color:var(--hard);}

  .save-flag{
    position:fixed; bottom:18px; right:18px; background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:11px; padding:7px 12px;
    border-radius:6px; opacity:0; transform:translateY(6px); transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .save-flag.show{opacity:1; transform:translateY(0);}

  .rail-toggle{display:none;}

  @media (max-width: 860px){
    .shell{grid-template-columns:1fr;}
    aside.rail{
      position:static; max-height:none; padding:14px 16px 0; overflow:visible;
      display:flex; flex-direction:column;
    }
    .rail-list{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px;}
    .rail-item{flex:0 0 auto; width:150px; margin-bottom:0;}
    main.content{padding:16px 16px 80px;}
    .top-inner{gap:14px;}
    .stat-strip{gap:14px;}
    .qtitle{white-space:normal;}
    .date-input{width:104px;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="num">FAANG PREP · 507 PROBLEMS</span>
      <h1>DSA Pattern Tracker</h1>
      <p>Arrays to system design, tracked one pattern at a time.</p>
    </div>
    <div class="stat-strip">
      <div class="stat">
        <span class="v mono" id="statTotal">507</span>
        <span class="l">total</span>
      </div>
      <div class="stat done">
        <span class="v mono" id="statDone">0</span>
        <span class="l">solved</span>
      </div>
      <div class="stat revise">
        <span class="v mono" id="statRevise">0</span>
        <span class="l">flagged</span>
      </div>
      <div class="ring-wrap">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle class="ring-track" cx="28" cy="28" r="24"></circle>
          <circle class="ring-fill" id="ringFill" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="150.8"></circle>
        </svg>
        <div class="ring-pct" id="ringPct">0%</div>
      </div>
      <div class="stat">
        <button id="authBtn" style="background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:4px; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px;">Log In</button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <p class="rail-title">SECTIONS</p>
    <div class="rail-list" id="railList"></div>
  </aside>

  <main class="content">
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search problems or patterns…" />
      </div>
      <div class="chip-group" id="diffChips">
        <button class="chip active" data-diff="All">All</button>
        <button class="chip" data-diff="Easy">Easy</button>
        <button class="chip" data-diff="Medium">Medium</button>
        <button class="chip" data-diff="Hard">Hard</button>
      </div>
      <div class="chip-group">
        <button class="chip" id="toggleUnsolved">Unsolved only</button>
        <button class="chip" id="toggleRevise">Flagged for revision</button>
      </div>
    </div>

    <div id="listRoot"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="big">∅</div>
      <div>No problems match these filters.</div>
    </div>
  </main>
</div>

<footer class="foot">
  <span>Progress saves automatically to your account.</span>
  <button id="resetBtn">Reset all progress</button>
</footer>

<div class="save-flag" id="saveFlag">saved</div>

<div id="authModal" style="display:none; position:fixed; inset:0; background:rgba(17,21,26,0.8); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div style="background:var(--bg-elev); border:1px solid var(--border); padding:24px; border-radius:8px; width:320px; text-align:center;">
    <h3 style="margin-top:0;">Sign In / Sign Up</h3>
    <input type="email" id="authEmail" placeholder="Email" style="width:100%; margin-bottom:10px; padding:8px; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); border-radius:4px;" />
    <input type="password" id="authPassword" placeholder="Password" style="width:100%; margin-bottom:15px; padding:8px; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); border-radius:4px;" />
    <button id="authSubmit" style="width:100%; padding:10px; background:var(--amber); color:#000; border:none; border-radius:4px; font-weight:600; cursor:pointer;">Continue</button>
    <button id="authClose" style="margin-top:10px; background:none; border:none; color:var(--text-faint); cursor:pointer;">Cancel</button>
    <div id="authError" style="color:var(--hard); font-size:12px; margin-top:10px; display:none;"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://shxlctwvfkfgivtnlvht.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_V1KrKiUr0gsQ86_lXYu63Q_GqYwyQb9';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;

// Auth UI logic
const authBtn = document.getElementById('authBtn');
const authModal = document.getElementById('authModal');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authSubmit = document.getElementById('authSubmit');
const authClose = document.getElementById('authClose');
const authError = document.getElementById('authError');

authBtn.addEventListener('click', async () => {
  if (currentUser) {
    await supabase.auth.signOut();
    currentUser = null;
    authBtn.textContent = 'Log In';
    progress = {};
    syncAllRows();
    updateRailCounts();
    updateStats();
    showSaveFlag('Logged out');
  } else {
    authModal.style.display = 'flex';
  }
});

authClose.addEventListener('click', () => { authModal.style.display = 'none'; });

authSubmit.addEventListener('click', async () => {
  authError.style.display = 'none';
  const email = authEmail.value;
  const password = authPassword.value;
  if(!email || !password) return;
  
  authSubmit.textContent = 'Wait...';
  
  // Try to sign in
  let { data, error } = await supabase.auth.signInWithPassword({ email, password });
  
  // If user doesn't exist, try to sign up
  if (error && error.message.includes('Invalid login credentials')) {
    const signup = await supabase.auth.signUp({ email, password });
    data = signup.data;
    error = signup.error;
    if(!error && data.user) {
        showSaveFlag('Account created! Please check your email to verify.');
        authSubmit.textContent = 'Continue';
        return;
    }
  }

  if (error) {
    authError.textContent = error.message;
    authError.style.display = 'block';
  } else {
    authModal.style.display = 'none';
    currentUser = data.user;
    authBtn.textContent = 'Log Out';
    await loadProgress();
    showSaveFlag('Logged in!');
  }
  authSubmit.textContent = 'Continue';
});

// Check session on load
supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) {
    currentUser = session.user;
    authBtn.textContent = 'Log Out';
    loadProgress();
  }
});

ess data one element at a time without looking back."}]

const STORAGE_KEY = 'dsa-tracker-progress-v1';
let progress = {}; // { [id]: {done:bool, date:'YYYY-MM-DD', revise:bool} }
let storageReady = false;

let filters = { search:'', diff:'All', unsolvedOnly:false, reviseOnly:false };

// ---------- Build section/subsection structure ----------
const sections = [];
const sectionIndex = {};
QUESTIONS.forEach(q => {
  if(!(q.section in sectionIndex)){
    sectionIndex[q.section] = { name:q.section, subs:{}, subOrder:[], ids:[] };
    sections.push(sectionIndex[q.section]);
  }
  const s = sectionIndex[q.section];
  s.ids.push(q.id);
  if(!(q.subsection in s.subs)){
    s.subs[q.subsection] = { name:q.subsection, pattern:q.pattern, items:[] };
    s.subOrder.push(q.subsection);
  }
  s.subs[q.subsection].items.push(q);
});

function slug(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

// ---------- Render rail ----------
const railList = document.getElementById('railList');
sections.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'rail-item';
  btn.dataset.target = 'sec-' + slug(s.name);
  btn.innerHTML = `
    <div class="rline">
      <span class="rname">${String(i+1).padStart(2,'0')}. ${s.name}</span>
    </div>
    <div class="rline">
      <span class="rcount mono" id="railcount-${slug(s.name)}">0/${s.ids.length}</span>
    </div>
    <div class="rail-bar"><i id="railbar-${slug(s.name)}" style="width:0%"></i></div>
  `;
  btn.addEventListener('click', () => {
    document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth', block:'start'});
  });
  railList.appendChild(btn);
});

// ---------- Render main list ----------
const listRoot = document.getElementById('listRoot');

function buildDOM(){
  listRoot.innerHTML = '';
  sections.forEach((s, si) => {
    const secEl = document.createElement('section');
    secEl.className = 'section-block';
    secEl.id = 'sec-' + slug(s.name);

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<span class="sidx mono">${String(si+1).padStart(2,'0')}</span><h2>${s.name}</h2><span class="scount mono">${s.ids.length} problems</span>`;
    secEl.appendChild(head);
    const rule = document.createElement('div');
    rule.className = 'section-rule';
    secEl.appendChild(rule);

    s.subOrder.forEach(subName => {
      const sub = s.subs[subName];
      const subEl = document.createElement('div');
      subEl.className = 'sub-block';
      subEl.id = 'sub-' + slug(s.name) + '-' + slug(subName);
      const subHead = document.createElement('div');
      subHead.className = 'sub-head';
      subHead.innerHTML = `<h3>${subName}</h3><div class="pattern">${sub.pattern || ''}</div>`;
      subEl.appendChild(subHead);

      sub.items.forEach(q => {
        subEl.appendChild(buildRow(q));
      });

      secEl.appendChild(subEl);
    });

    listRoot.appendChild(secEl);
  });
}

function buildRow(q){
  const row = document.createElement('div');
  row.className = 'qrow';
  row.dataset.id = q.id;
  row.dataset.title = q.title.toLowerCase();
  row.dataset.pattern = (q.pattern||'').toLowerCase();
  row.dataset.diff = q.difficulty;

  const chk = document.createElement('button');
  chk.className = 'chk';
  chk.setAttribute('aria-label', 'Mark solved');
  chk.addEventListener('click', () => toggleDone(q.id));
  row.appendChild(chk);

  const idEl = document.createElement('span');
  idEl.className = 'qid mono';
  idEl.textContent = '#' + q.id;
  row.appendChild(idEl);

  const titleEl = document.createElement('span');
  titleEl.className = 'qtitle';
  titleEl.textContent = q.title;
  titleEl.title = q.title;
  row.appendChild(titleEl);

  const diffEl = document.createElement('span');
  diffEl.className = 'diff-tag ' + q.difficulty;
  diffEl.textContent = q.difficulty;
  row.appendChild(diffEl);

  const dateEl = document.createElement('input');
  dateEl.type = 'date';
  dateEl.className = 'date-input';
  dateEl.addEventListener('change', (e) => setDate(q.id, e.target.value));
  row.appendChild(dateEl);

  const revBtn = document.createElement('button');
  revBtn.className = 'rev-btn';
  revBtn.title = 'Flag for revision';
  revBtn.textContent = '↻';
  revBtn.addEventListener('click', () => toggleRevise(q.id));
  row.appendChild(revBtn);

  return row;
}

buildDOM();

// ---------- State <-> DOM sync ----------
function getEntry(id){
  return progress[id] || { done:false, date:'', revise:false };
}

function syncRow(id){
  const row = listRoot.querySelector(`.qrow[data-id="${id}"]`);
  if(!row) return;
  const entry = getEntry(id);
  const chk = row.querySelector('.chk');
  const dateEl = row.querySelector('.date-input');
  const revBtn = row.querySelector('.rev-btn');

  chk.classList.toggle('checked', !!entry.done);
  row.classList.toggle('done', !!entry.done);
  dateEl.value = entry.date || '';
  dateEl.disabled = !entry.done;
  revBtn.classList.toggle('on', !!entry.revise);
}

function syncAllRows(){
  QUESTIONS.forEach(q => syncRow(q.id));
  updateStats();
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function toggleDone(id){
  const entry = getEntry(id);
  entry.done = !entry.done;
  if(entry.done && !entry.date){
    entry.date = todayStr();
  }
  progress[id] = entry;
  syncRow(id);
  updateStats();
  updateRailCounts();
  persist();
}

function setDate(id, val){
  const entry = getEntry(id);
  entry.date = val;
  progress[id] = entry;
  persist();
}

function toggleRevise(id){
  const entry = getEntry(id);
  entry.revise = !entry.revise;
  progress[id] = entry;
  syncRow(id);
  updateStats();
  applyFilters();
  persist();
}

// ---------- Stats ----------
function updateStats(){
  const total = QUESTIONS.length;
  let done = 0, revise = 0;
  QUESTIONS.forEach(q => {
    const e = progress[q.id];
    if(e && e.done) done++;
    if(e && e.revise) revise++;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statRevise').textContent = revise;
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('ringPct').textContent = pct + '%';
  const circumference = 150.8;
  const offset = circumference - (circumference * pct / 100);
  document.getElementById('ringFill').style.strokeDashoffset = offset;
}

function updateRailCounts(){
  sections.forEach(s => {
    let done = 0;
    s.ids.forEach(id => { if(progress[id] && progress[id].done) done++; });
    const sl = slug(s.name);
    const countEl = document.getElementById('railcount-' + sl);
    const barEl = document.getElementById('railbar-' + sl);
    if(countEl) countEl.textContent = `${done}/${s.ids.length}`;
    if(barEl) barEl.style.width = (s.ids.length ? (done/s.ids.length*100) : 0) + '%';
  });
}

// ---------- Filters ----------
function applyFilters(){
  let anyVisible = false;
  const q = filters.search.trim();
  QUESTIONS.forEach(item => {
    const row = listRoot.querySelector(`.qrow[data-id="${item.id}"]`);
    if(!row) return;
    let visible = true;
    if(q && !(row.dataset.title.includes(q) || row.dataset.pattern.includes(q))) visible = false;
    if(filters.diff !== 'All' && row.dataset.diff !== filters.diff) visible = false;
    const entry = getEntry(item.id);
    if(filters.unsolvedOnly && entry.done) visible = false;
    if(filters.reviseOnly && !entry.revise) visible = false;
    row.classList.toggle('hidden', !visible);
    if(visible) anyVisible = true;
  });

  // hide empty subsections / sections
  document.querySelectorAll('.sub-block').forEach(sub => {
    const rows = sub.querySelectorAll('.qrow');
    const anyShown = Array.from(rows).some(r => !r.classList.contains('hidden'));
    sub.style.display = anyShown ? '' : 'none';
  });
  document.querySelectorAll('.section-block').forEach(sec => {
    const subs = sec.querySelectorAll('.sub-block');
    const anyShown = Array.from(subs).some(s => s.style.display !== 'none');
    sec.style.display = anyShown ? '' : 'none';
  });

  document.getElementById('emptyState').style.display = anyVisible ? 'none' : 'block';
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  filters.search = e.target.value.toLowerCase();
  applyFilters();
});

document.querySelectorAll('#diffChips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#diffChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    filters.diff = chip.dataset.diff;
    applyFilters();
  });
});

const toggleUnsolvedBtn = document.getElementById('toggleUnsolved');
toggleUnsolvedBtn.addEventListener('click', () => {
  filters.unsolvedOnly = !filters.unsolvedOnly;
  toggleUnsolvedBtn.classList.toggle('active');
  applyFilters();
});

const toggleReviseBtn = document.getElementById('toggleRevise');
toggleReviseBtn.addEventListener('click', () => {
  filters.reviseOnly = !filters.reviseOnly;
  toggleReviseBtn.classList.toggle('active', filters.reviseOnly);
  toggleReviseBtn.classList.toggle('v-active', filters.reviseOnly);
  applyFilters();
});

// ---------- Reset ----------
document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('Reset all progress? This clears every checkmark, date, and revision flag.')) return;
  progress = {};
  syncAllRows();
  updateRailCounts();
  applyFilters();
  await persist(true);
});

// ---------- Persistence ----------
let saveTimer = null;
function showSaveFlag(text){
  const flag = document.getElementById('saveFlag');
  flag.textContent = text;
  flag.classList.add('show');
  clearTimeout(showSaveFlag._t);
  showSaveFlag._t = setTimeout(() => flag.classList.remove('show'), 1400);
}

async function persist(immediate){
  clearTimeout(saveTimer);
  const doSave = async () => {
    try {
      if(currentUser) {
        const { error } = await supabase
          .from('user_progress')
          .upsert({ user_id: currentUser.id, progress_data: progress });
        if(error) throw error;
        showSaveFlag('saved to cloud');
      } else if(window.storage && window.storage.set){
        await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false);
        showSaveFlag('saved locally');
      }
    } catch(err){
      console.error('Storage error:', err);
      showSaveFlag('save failed');
    }
  };
  if(immediate){
    await doSave();
  } else {
    saveTimer = setTimeout(doSave, 400);
  }
}

async function loadProgress(){
  try {
    if(currentUser) {
      const { data, error } = await supabase
        .from('user_progress')
        .select('progress_data')
        .eq('user_id', currentUser.id)
        .single();
      
      if (data && data.progress_data) {
         progress = data.progress_data;
      } else {
         progress = {};
      }
    } else if(window.storage && window.storage.get){
      const result = await window.storage.get(STORAGE_KEY, false);
      if(result && result.value){
        progress = JSON.parse(result.value);
      }
    }
  } catch(err){
    progress = {};
  }
  storageReady = true;
  syncAllRows();
  updateRailCounts();
  updateStats();
}

// ---------- Scrollspy for rail active state ----------
const railBtns = Array.from(document.querySelectorAll('.rail-item'));
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      const id = entry.target.id;
      railBtns.forEach(b => b.classList.toggle('active', b.dataset.target === id));
    }
  });
}, { rootMargin: '-100px 0px -70% 0px', threshold: 0 });
document.querySelectorAll('.section-block').forEach(sec => observer.observe(sec));

// ---------- Init ----------
loadProgress();
</script>
